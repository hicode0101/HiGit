[package]
name = "higit-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["backend-git2"]
backend-git2 = ["dep:git2"]
# 预留后端：gix 补齐 push / CLI 兜底，见 docs/technical-design.md §4.1
backend-gix = []
backend-cli = []

[dependencies]
git2 = { workspace = true, optional = true }

# Unix（Linux/macOS）统一从源码编译 OpenSSL（vendored）：macOS Intel 包是在
# M 系列 runner 上交叉编译的，系统里只有 arm64 的 Homebrew OpenSSL，openssl-sys
# 找不到 x86_64 的库会直接构建失败（release.yml 的 x86_64-apple-darwin job）。
# macOS 上 libgit2 实际走 SecureTransport，这里的 OpenSSL 只是满足 openssl-sys 构建。
[target.'cfg(unix)'.dependencies]
git2 = { workspace = true, optional = true, features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
# 让 libgit2 内嵌的 libssh2 在 Windows 上也用 OpenSSL 后端解析私钥。默认的 WinCNG
# 后端只认 PKCS#1 的 RSA / DSA，无法使用 OpenSSH 容器（ed25519）、PKCS#8 与 EC 密钥；
# 开启后三平台统一 OpenSSL 后端，仅 PuTTY .ppk 不支持。feature 经依赖图合并到
# git2 → libgit2-sys → libssh2-sys 的同一次构建上，vendored 无需系统安装 OpenSSL
# （需 Perl；NASM 缺失时 openssl-src 自动 no-asm）。
libssh2-sys = { version = "0.3", features = ["openssl-on-win32", "vendored-openssl"] }
