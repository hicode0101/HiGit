[package]
name = "higit-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["backend-git2"]
backend-git2 = ["dep:git2"]
# 预留后端：gix 补齐 push / CLI 兜底，见 docs/technical-design.md §4.1
backend-gix = []
backend-cli = []

[dependencies]
git2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
git2 = { workspace = true, optional = true, features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
